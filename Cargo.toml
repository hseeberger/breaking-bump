[package]
name        = "cargo-breaking-bump"
description = "Detect semver-incompatible bumps of dependencies that appear in the public API of Rust crates"
version     = "0.1.2"
edition     = "2024"
license     = "Apache-2.0"
readme      = "README.md"
repository  = "https://github.com/hseeberger/breaking-bump"
keywords    = [ "cargo", "semver", "dependencies", "breaking-change" ]
categories  = [ "development-tools::cargo-plugins" ]
include     = [ "src/**", "tests/**", "README.md", "LICENSE", "CHANGELOG.md" ]
publish     = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
anyhow         = { version = "1.0" }
base64         = { version = "0.23" }
cargo_metadata = { version = "0.23" }
clap           = { version = "4.6", features = [ "derive", "env" ] }
rustdoc-types  = { version = "0.61" }
semver         = { version = "1.0" }
serde          = { version = "1.0", features = [ "derive" ] }
serde_json     = { version = "1.0" }
tempfile       = { version = "3.27" }
thiserror      = { version = "2.0" }
toml           = { version = "1.1" }
ureq           = { version = "3.4", features = [ "json" ] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
