name: Breaking Bump

on:
  pull_request:

permissions:
  contents: read

jobs:
  toolchain:
    name: Setup Rust toolchain
    runs-on: ubuntu-latest
    outputs:
      nightly: ${{ steps.set_toolchain.outputs.nightly }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Output toolchain
        id: set_toolchain
        run: |
          nightly=$(rustc --version | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sed 's/^/nightly-/')
          echo "nightly=$nightly" | tee -a "$GITHUB_OUTPUT"

  check:
    name: Breaking Bump Check
    runs-on: ubuntu-latest
    needs: toolchain
    permissions:
      contents: read
    outputs:
      result: ${{ steps.breaking-bump.outputs.result }}
      violations: ${{ steps.breaking-bump.outputs.violations }}
      head: ${{ steps.breaking-bump.outputs.head }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check
        id: breaking-bump
        uses: hseeberger/breaking-bump@2ebee577b70689d933b6beb9dcb4126ba63b16e9
        with:
          command: check
          nightly: ${{ needs.toolchain.outputs.nightly }}

  mark:
    name: Breaking Bump Mark
    runs-on: ubuntu-latest
    needs: check
    if: >-
      ${{ !cancelled()
      && needs.check.outputs.violations == 'missing-marker'
      && github.event.pull_request.user.login == 'dependabot[bot]' }}
    permissions: {}
    steps:
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Mark
        uses: hseeberger/breaking-bump@2ebee577b70689d933b6beb9dcb4126ba63b16e9
        with:
          command: mark
          token: ${{ steps.app-token.outputs.token }}

  assert:
    name: Assert check outputs
    runs-on: ubuntu-latest
    needs: check
    if: ${{ !cancelled() }}
    permissions: {}
    steps:
      - name: Assert
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          RESULT: ${{ needs.check.outputs.result }}
          VIOLATIONS: ${{ needs.check.outputs.violations }}
          HEAD: ${{ needs.check.outputs.head }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "check=$CHECK_RESULT result=$RESULT violations=$VIOLATIONS head=$HEAD expected=$EXPECTED_HEAD"
          test "$CHECK_RESULT" = failure
          test "$RESULT" = breaking
          test "$VIOLATIONS" = missing-marker
          test "$HEAD" = "$EXPECTED_HEAD"

  mark-smoke:
    name: Mark smoke test
    runs-on: ubuntu-latest
    needs: check
    if: ${{ !cancelled() }}
    continue-on-error: true
    permissions:
      pull-requests: read
    steps:
      - name: Mark
        uses: hseeberger/breaking-bump@2ebee577b70689d933b6beb9dcb4126ba63b16e9
        with:
          command: mark
          token: ${{ github.token }}
